<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户注册表单</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
  
  <!-- 配置Tailwind自定义颜色和字体 -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#165DFF',
            secondary: '#36D399',
            neutral: {
              100: '#F3F4F6',
              200: '#E5E7EB',
              300: '#D1D5DB',
              700: '#374151',
              800: '#1F2937',
              900: '#111827'
            }
          },
          fontFamily: {
            inter: ['Inter', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  
  <!-- 自定义工具类 -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .form-input-focus {
        @apply focus:border-primary focus:ring-2 focus:ring-primary/20 focus:outline-none;
      }
      .form-label {
        @apply block text-sm font-medium text-neutral-700 mb-1;
      }
      .form-control {
        @apply w-full px-4 py-2 rounded-lg border border-neutral-300 bg-white text-neutral-800 transition-all duration-200 form-input-focus;
      }
      .btn-primary {
        @apply bg-primary hover:bg-primary/90 text-white font-medium py-2.5 px-6 rounded-lg transition-all duration-200 transform hover:scale-[1.02] active:scale-[0.98] shadow-lg hover:shadow-primary/20 focus:outline-none focus:ring-2 focus:ring-primary/50;
      }
      .card-effect {
        @apply bg-white rounded-2xl shadow-xl transition-all duration-300 hover:shadow-2xl hover:-translate-y-1;
      }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen font-inter flex items-center justify-center p-4">
  <!-- 背景装饰元素 -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -right-20 -top-20 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
    <div class="absolute -left-20 -bottom-20 w-80 h-80 bg-secondary/10 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md relative z-10">
    <!-- 表单卡片 -->
    <div class="card-effect p-8">
      <div class="text-center mb-8">
        <h2 class="text-[clamp(1.5rem,3vw,2rem)] font-bold text-neutral-800 mb-2">用户注册</h2>
        <p class="text-neutral-500">请填写以下信息创建账户</p>
      </div>
      
      <form id="registerForm" action="/submit-form" method="POST">
        <!-- 用户名 -->
        <div class="mb-6">
          <label for="username" class="form-label">
            <i class="fa fa-user-circle mr-2 text-primary"></i>用户名
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
              <i class="fa fa-user"></i>
            </span>
            <input type="text" id="username" name="username" required
                   class="form-control pl-10"
                   placeholder="请输入用户名">
          </div>
          <p class="hidden text-red-500 text-xs mt-1" id="usernameError">
            <i class="fa fa-exclamation-circle mr-1"></i>用户名不能为空
          </p>
        </div>
        
        <!-- 邮箱 -->
        <div class="mb-6">
          <label for="email" class="form-label">
            <i class="fa fa-envelope-circle-check mr-2 text-primary"></i>邮箱
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
              <i class="fa fa-envelope"></i>
            </span>
            <input type="email" id="email" name="email" required
                   class="form-control pl-10"
                   placeholder="请输入邮箱地址">
          </div>
          <p class="hidden text-red-500 text-xs mt-1" id="emailError">
            <i class="fa fa-exclamation-circle mr-1"></i>请输入有效的邮箱地址
          </p>
        </div>
        
        <!-- 密码 -->
        <div class="mb-6">
          <label for="password" class="form-label">
            <i class="fa fa-lock-circle mr-2 text-primary"></i>密码
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
              <i class="fa fa-lock"></i>
            </span>
            <input type="password" id="password" name="password" required
                   class="form-control pl-10"
                   placeholder="请输入密码">
            <button type="button" id="togglePassword" 
                    class="absolute inset-y-0 right-0 flex items-center pr-3 text-neutral-500 hover:text-primary">
              <i class="fa fa-eye-slash"></i>
            </button>
          </div>
          <p class="text-neutral-500 text-xs mt-1">
            <i class="fa fa-info-circle mr-1"></i>密码至少包含8个字符，并包括字母和数字
          </p>
        </div>
        
        <!-- 性别 -->
        <div class="mb-6">
          <label class="form-label">
            <i class="fa fa-venus-mars mr-2 text-primary"></i>性别
          </label>
          <div class="flex space-x-4 mt-2">
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" id="male" name="gender" value="male" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded-full peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <div class="w-3 h-3 rounded-full bg-white scale-0 peer-checked:scale-100 transition-transform duration-200"></div>
              </div>
              <span class="ml-2 text-neutral-700">男</span>
            </label>
            <label class="inline-flex items-center cursor-pointer">
              <input type="radio" id="female" name="gender" value="female" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded-full peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <div class="w-3 h-3 rounded-full bg-white scale-0 peer-checked:scale-100 transition-transform duration-200"></div>
              </div>
              <span class="ml-2 text-neutral-700">女</span>
            </label>
          </div>
        </div>
        
        <!-- 兴趣爱好 -->
        <div class="mb-6">
          <label class="form-label">
            <i class="fa fa-heart-circle mr-2 text-primary"></i>兴趣爱好
          </label>
          <div class="grid grid-cols-2 gap-3 mt-2">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="reading" name="hobbies" value="reading" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <i class="fa fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity"></i>
              </div>
              <span class="ml-2 text-neutral-700">阅读</span>
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="sports" name="hobbies" value="sports" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <i class="fa fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity"></i>
              </div>
              <span class="ml-2 text-neutral-700">运动</span>
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="music" name="hobbies" value="music" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <i class="fa fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity"></i>
              </div>
              <span class="ml-2 text-neutral-700">音乐</span>
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" id="travel" name="hobbies" value="travel" class="sr-only peer">
              <div class="w-5 h-5 border border-neutral-300 rounded peer-checked:bg-primary peer-checked:border-primary flex items-center justify-center transition-all duration-200">
                <i class="fa fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity"></i>
              </div>
              <span class="ml-2 text-neutral-700">旅行</span>
            </label>
          </div>
        </div>
        
        <!-- 国家 -->
        <div class="mb-6">
          <label for="country" class="form-label">
            <i class="fa fa-globe-asia mr-2 text-primary"></i>国家
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
              <i class="fa fa-map-marker"></i>
            </span>
            <select id="country" name="country" 
                    class="form-control pl-10 appearance-none">
              <option value="">请选择国家</option>
              <option value="cn">中国</option>
              <option value="us">美国</option>
              <option value="uk">英国</option>
              <option value="jp">日本</option>
              <option value="kr">韩国</option>
            </select>
            <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-neutral-500">
              <i class="fa fa-chevron-down"></i>
            </span>
          </div>
        </div>
        
        <!-- 留言 -->
        <div class="mb-8">
          <label for="message" class="form-label">
            <i class="fa fa-comment-dots mr-2 text-primary"></i>留言
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-neutral-500">
              <i class="fa fa-pencil"></i>
            </span>
            <textarea id="message" name="message" rows="4" 
                      class="form-control pl-10"
                      placeholder="有什么想告诉我们的..."></textarea>
          </div>
        </div>
        
        <!-- 提交按钮 -->
        <div class="text-center">
          <button type="submit" class="btn-primary w-full flex items-center justify-center">
            <i class="fa fa-user-plus mr-2"></i>注册账户
          </button>
        </div>
      </form>
      
      <!-- 底部文本 -->
      <div class="text-center mt-6 text-neutral-500 text-sm">
        已有账户？<a href="#" class="text-primary hover:underline">立即登录</a>
      </div>
    </div>
    
    <!-- 成功提示框 -->
    <div id="successToast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-secondary text-white px-6 py-3 rounded-lg shadow-lg opacity-0 transition-opacity duration-500 flex items-center">
      <i class="fa fa-check-circle mr-2"></i>
      <span>注册成功！正在跳转...</span>
    </div>
  </div>

  <script>
    // 表单验证
    const form = document.getElementById('registerForm');
    const username = document.getElementById('username');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const usernameError = document.getElementById('usernameError');
    const emailError = document.getElementById('emailError');
    const successToast = document.getElementById('successToast');
    const togglePassword = document.getElementById('togglePassword');
    
    // 密码显示/隐藏切换
    togglePassword.addEventListener('click', function() {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      
      // 切换图标
      const icon = togglePassword.querySelector('i');
      if (type === 'text') {
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      } else {
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      }
    });
    
    // 简单的表单验证
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      let isValid = true;
      
      // 验证用户名
      if (username.value.trim() === '') {
        usernameError.classList.remove('hidden');
        username.classList.add('border-red-500');
        isValid = false;
      } else {
        usernameError.classList.add('hidden');
        username.classList.remove('border-red-500');
      }
      
      // 验证邮箱
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailRegex.test(email.value.trim())) {
        emailError.classList.remove('hidden');
        email.classList.add('border-red-500');
        isValid = false;
      } else {
        emailError.classList.add('hidden');
        email.classList.remove('border-red-500');
      }
      
      // 如果验证通过，显示成功提示
      if (isValid) {
        successToast.classList.replace('opacity-0', 'opacity-100');
        
        // 模拟提交表单
        setTimeout(() => {
          successToast.classList.replace('opacity-100', 'opacity-0');
          form.reset();
        }, 3000);
      }
    });
    
    // 输入框获得焦点时移除错误状态
    username.addEventListener('focus', function() {
      usernameError.classList.add('hidden');
      username.classList.remove('border-red-500');
    });
    
    email.addEventListener('focus', function() {
      emailError.classList.add('hidden');
      email.classList.remove('border-red-500');
    });
  </script>
</body>
</html>
